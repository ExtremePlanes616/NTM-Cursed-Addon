name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: [ 'V-*' ]
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download HBM's NTM CE 2.6.1.0 for compilation stability
        run: wget https://mediafilez.forgecdn.net/files/8873/889/NTM-CE-1.12.2-2.6.1.0.jar -O ~/NTM-CE-1.12.2-2.6.1.0.jar
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Decomp Workspace Setup
        run: ./gradlew setupDecompWorkspace
      
      # We pipe the build output to a text log file so if it fails, you can upload the raw error log!
      - name: Build with Gradle
        run: ./gradlew build > build_output.log 2>&1
        env:
          ORG_GRADLE_PROJECT_org_gradle_jvmargs: -Xmx3G
      
      # If the build step fails, this step will trigger and upload the raw terminal compile errors
      - name: Upload Compile Error Log on Failure
        if: failure() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build_output.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Standard successful artifact upload step
      - name: Upload addon JAR to GitHub Releases
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/NTM_Cursed_Edition-CE_Addon.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear Gradle cache
        run: ./gradlew clean
